name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ChargeMeter.xcodeproj \
            -target ChargeMeter \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ChargeMeter.app Payload/
          zip -qry ChargeMeter-unsigned.ipa Payload
          ls -lh ChargeMeter-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeMeter-unsigned-ipa
          path: ChargeMeter-unsigned.ipa
